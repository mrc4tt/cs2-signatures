name: track-signatures

on:
  schedule:
    # Every 30 min. check_update short-circuits when manifests are unchanged.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  track:
    runs-on: self-hosted   # your x86-64 VPS runner (DepotDownloader + .NET)
    steps:
      - uses: actions/checkout@v4

      - name: Check for CS2 update
        id: upd
        run: |
          set +e
          python3 scripts/check_update.py --manifest data/manifest.json
          CODE=$?
          if [ "$CODE" -eq 1 ]; then echo "check failed"; exit 1; fi
          echo "changed=$([ "$CODE" -eq 10 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream gamedata.json
        env:
          # PAT with Contents:read on the private mrc4tt fork.
          GITHUB_TOKEN: ${{ secrets.GAMEDATA_TOKEN }}
        run: python3 scripts/fetch_gamedata.py --out data/gamedata.json

      - name: Download server binaries
        env:
          # Optional — anonymous works for these depots. Set only if needed.
          STEAM_USER: ${{ secrets.STEAM_USER }}
          STEAM_PASS: ${{ secrets.STEAM_PASS }}
        run: |
          eval "$(bash scripts/download_bins.sh | grep -E '^(LINUX_SO|LINUX_ENGINE2|WIN_DLL|WIN_ENGINE2)=')"
          { echo "LINUX_SO=$LINUX_SO"; echo "LINUX_ENGINE2=$LINUX_ENGINE2";
            echo "WIN_DLL=$WIN_DLL"; echo "WIN_ENGINE2=$WIN_ENGINE2"; } >> "$GITHUB_ENV"

      - name: Validate signatures
        id: val
        run: |
          set +e
          python3 scripts/validate_sigs.py \
            --gamedata data/gamedata.json \
            --linux "$LINUX_SO" --windows "$WIN_DLL" \
            --linux-engine2 "$LINUX_ENGINE2" --windows-engine2 "$WIN_ENGINE2" \
            --manifest data/manifest.json \
            --out reports/status.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Generate report
        run: |
          python3 scripts/gen_report.py \
            --status reports/status.json \
            --readme README.md --docs docs/CounterStrikeSharp.md \
            --history-dir reports/history \
            --date "$(date -u '+%B %-d, %Y at %H:%M:%S GMT')" \
            --iso "$(date -u +%F)"

      - name: Commit results
        run: |
          git config user.name "sig-tracker"
          git config user.email "bot@localhost"
          git add data/manifest.json data/gamedata.json README.md docs/ reports/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "track: $(cat data/manifest.json | tr -d '\n ') ($(date -u +%F))"
            git push
          fi

      - name: Auto-issue on broken sigs
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: python3 scripts/open_issue.py --status reports/status.json

      - name: Gate on broken sigs
        if: steps.val.outputs.exit != '0'
        run: |
          echo "::error::one or more signatures are BROKEN — see docs/CounterStrikeSharp.md"
          exit 1
